# GitHub Pages'a otomatik deploy (main'e her push'ta)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web (Expo)
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: npx expo export --platform web

      - name: Fix asset paths for GitHub Pages subpath
        run: |
          REPO="${{ github.event.repository.name }}"
          mv dist/_expo dist/expo 2>/dev/null || true
          sed -i "s|<head>|<head><base href=\"/${REPO}/\">|" dist/index.html
          sed -i "s|src=\"/|src=\"/${REPO}/|g" dist/index.html
          sed -i "s|href=\"/|href=\"/${REPO}/|g" dist/index.html
          find dist -name "*.js" -exec sed -i "s#/expo/#/${REPO}/expo/#g" {} \;
          find dist -name "*.js" -exec sed -i "s#/meta.json#/${REPO}/meta.json#g" {} \;

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
