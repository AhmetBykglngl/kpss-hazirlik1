# Render.com - API sunucusu (kusursuz çalışma: health check + tek process)
# Dashboard: https://dashboard.render.com
services:
  - type: web
    name: kpss-api
    runtime: node
    buildCommand: npm install
    startCommand: node api/index.js
    envVars:
      - key: NODE_VERSION
        value: "20"
    healthCheckPath: /api/health
    plan: free
